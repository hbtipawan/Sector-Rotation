name: NSE test

# One-off check: can GitHub's machines download NSE's official results filings?
# Run it from Actions -> NSE test -> Run workflow. Delete this file afterwards.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - name: Test NSE and Yahoo
        run: |
          python - <<'PYEOF'
          """Can GitHub's machines reach NSE's filings? Prints a PASS/FAIL table (also shown on the run's summary page)."""
          import os, re, time, requests

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                "Accept": "application/json,text/html,*/*", "Accept-Language": "en-US,en;q=0.9", "Referer": "https://www.nseindia.com/"}
          SYMS = ["SUNFLAG", "AJANTPHARM", "ARFIN"]
          rows = []


          def check(name, fn):
              t0 = time.time()
              try:
                  ok, detail = fn()
              except Exception as e:
                  ok, detail = False, f"{type(e).__name__}: {str(e)[:120]}"
              rows.append((name, "PASS" if ok else "FAIL", f"{time.time() - t0:.1f}s", detail))
              print(f"{'PASS' if ok else 'FAIL'}  {name}: {detail}", flush=True)
              return ok


          def get(s, url):
              return s.get(url, headers=UA, timeout=30)


          def run(label, s):
              links = {}

              def filings(sym):
                  def f():
                      r = get(s, f"https://www.nseindia.com/api/integrated-filing-results?index=equities&symbol={sym}&type=Integrated%20Filing-%20Financials")
                      if r.status_code != 200:
                          return False, f"HTTP {r.status_code}"
                      d = r.json().get("data", [])
                      if d:
                          links[sym] = d[0]["xbrl"]
                      return bool(d), f"{len(d)} filings, latest quarter {d[0]['qe_Date'] if d else '-'}"
                  return f

              for sym in SYMS:
                  check(f"[{label}] results list {sym}", filings(sym))

              def xbrl():
                  sym, url = next(iter(links.items()))
                  r = get(s, url)
                  g = lambda t: (re.search(r"<in-capmkt:" + t + r'\b[^>]*contextRef="OneD"[^>]*>([^<]+)<', r.text) or [None, None])[1]
                  rev, pat = g("RevenueFromOperations"), g("ProfitLossForPeriod")
                  return bool(rev), f"{sym}: revenue Rs {float(rev) / 1e7:,.1f} Cr, profit Rs {float(pat) / 1e7:,.1f} Cr" if rev else f"HTTP {r.status_code}"
              if links:
                  check(f"[{label}] results file (XBRL)", xbrl)

              def shp():
                  r = get(s, "https://www.nseindia.com/api/corporate-share-holdings-master?index=equities&symbol=SUNFLAG")
                  if r.status_code != 200:
                      return False, f"HTTP {r.status_code}"
                  d = r.json()
                  return bool(d), f"{len(d)} quarters, latest {d[0]['date']}: promoter {d[0]['pr_and_prgrp']}%"
              check(f"[{label}] shareholding", shp)

              def bulk():
                  r = get(s, "https://www.nseindia.com/api/integrated-filing-results?index=equities&type=Integrated%20Filing-%20Financials")
                  if r.status_code != 200:
                      return False, f"HTTP {r.status_code}"
                  d = r.json().get("data", [])
                  return bool(d), f"{len(d)} recent filings across all companies"
              check(f"[{label}] all-company recent filings", bulk)


          # 1) plain requests (what the nightly job would do)
          plain = requests.Session()
          run("plain", plain)

          # 2) with a browser-style cookie from the NSE home page (common workaround)
          if any(r[1] == "FAIL" for r in rows):
              ck = requests.Session()
              check("[cookie] NSE home page", lambda: ((r := get(ck, "https://www.nseindia.com/")).status_code == 200, f"HTTP {r.status_code}, {len(ck.cookies)} cookies"))
              run("cookie", ck)

          # 3) Yahoo Finance backup
          def yahoo():
              import yfinance as yf
              q = yf.Ticker("SUNFLAG.NS").quarterly_income_stmt
              rev = q.loc["Total Revenue"].dropna()
              return len(rev) > 0, f"{len(rev)} quarters, latest {rev.index[0]:%b-%Y} revenue Rs {rev.iloc[0] / 1e7:,.1f} Cr"
          check("Yahoo Finance quarterly results", yahoo)

          nse_ok = any(r[0].startswith("[plain] results file") and r[1] == "PASS" for r in rows)
          nse_ck = any(r[0].startswith("[cookie] results file") and r[1] == "PASS" for r in rows)
          verdict = ("NSE WORKS from GitHub - fully automatic fundamentals are possible." if nse_ok else
                     "NSE WORKS from GitHub with a cookie - fully automatic fundamentals are possible." if nse_ck else
                     "NSE BLOCKS GitHub - use Yahoo / PC script fallback.")
          print("\nVERDICT:", verdict)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"## NSE connectivity test\n\n**{verdict}**\n\n| Check | Result | Time | Detail |\n|---|---|---|---|\n")
                  for r in rows:
                      f.write(f"| {r[0]} | {'✅' if r[1] == 'PASS' else '❌'} {r[1]} | {r[2]} | {r[3]} |\n")
          PYEOF
