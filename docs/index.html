<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKC Sector Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E6E9; --panel:#F6F7F8; --ink:#11161B; --muted:#47505A; --rule:#B9C0C7; --track:#D3D8DD;
  --up:#0B7A3B; --down:#B42318; --sel:#1F4E79; --sel-ink:#fff; --warn:#8A5A00; --focus:#1F4E79;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2026; --panel:#252B32; --ink:#F3F5F7; --muted:#B4BCC5; --rule:#3E4650; --track:#323941;
    --up:#46C978; --down:#FF7B6E; --sel:#7FB2E5; --sel-ink:#0E1823; --warn:#F2C14E; --focus:#7FB2E5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2026; --panel:#252B32; --ink:#F3F5F7; --muted:#B4BCC5; --rule:#3E4650; --track:#323941;
  --up:#46C978; --down:#FF7B6E; --sel:#7FB2E5; --sel-ink:#0E1823; --warn:#F2C14E; --focus:#7FB2E5; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 "IBM Plex Sans",system-ui,sans-serif}
.num{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.asof{color:var(--muted);font-size:16px;margin-top:4px}
.theme-btn{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:7px 14px;cursor:pointer}

.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 16px}
.ro{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:9px 12px}
.ro .k{font-size:15px;color:var(--muted)}
.ro .v{font-size:22px}

nav.tabs{display:flex;gap:0;border-bottom:2px solid var(--rule);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 18px;font-size:19px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sel)}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer;font-weight:500;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.ctl-label{color:var(--muted);font-size:15px;margin-right:6px}

.panel{background:var(--panel);border:1.5px solid var(--rule);border-radius:8px}
.note{color:var(--muted);font-size:15px;margin:10px 2px 0}

/* rotation bars — the one bold element */
.bars{padding:6px 0}
.brow{display:grid;grid-template-columns:minmax(150px,1.3fr) 2.2fr 90px 64px;align-items:center;gap:12px;padding:7px 16px;cursor:pointer;border-top:1px solid var(--track)}
.brow:first-child{border-top:0}
.brow:hover,.brow[aria-expanded="true"]{background:color-mix(in srgb,var(--sel) 9%,transparent)}
.bname{font-weight:600;font-size:18px;line-height:1.25}
.bname .cnt{color:var(--muted);font-weight:400;font-size:15px;margin-left:6px}
.btrack{position:relative;height:26px;background:var(--track);border-radius:3px}
.btrack .zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.btrack .fill{position:absolute;top:3px;bottom:3px;border-radius:2px}
.bval{text-align:right;font-size:20px}
.up{color:var(--up)} .down{color:var(--down)}
.fill.up{background:var(--up)} .fill.down{background:var(--down)}
.rk{font-size:15px;text-align:right;color:var(--muted)}
.rk.gain{color:var(--up)} .rk.loss{color:var(--down)}
.bsub{grid-column:1/-1;font-size:15px;color:var(--muted);margin-top:-4px}
.members{grid-column:1/-1;padding:6px 0 10px;cursor:default}

table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--track)}
th{font-size:15px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.sym a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--rule)}
td.sym a:hover{border-bottom-color:var(--sel)}
td .nm{display:block;font-size:14px;color:var(--muted);font-weight:400;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.tscroll{overflow-x:auto;max-height:72vh}
.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:14px;font-weight:600;border:1.5px solid currentColor}
.st2{color:var(--up)} .st4{color:var(--down)} .st1,.st3{color:var(--muted)}
.more{display:block;margin:12px auto;padding:9px 20px;background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;cursor:pointer;font-weight:600}

.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.filters input[type=search],.filters select{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
.filters input[type=search]{width:220px}
.filters label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.filters input[type=checkbox]{width:20px;height:20px;accent-color:var(--sel)}

/* breadth */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.gauge{padding:12px 14px}
.gauge .k{color:var(--muted);font-size:15px}
.gauge .v{font-size:34px;line-height:1.15}
.gauge .d{font-size:15px}
.gbar{height:10px;background:var(--track);border-radius:2px;margin-top:8px;position:relative}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--sel);border-radius:2px}
.chart{padding:12px 12px 6px;margin-bottom:14px}
.chart h3{margin:2px 4px 6px;font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted);margin:0 4px 6px}
.legend span::before{content:"";display:inline-block;width:18px;height:4px;margin-right:6px;vertical-align:middle;background:var(--c)}
svg text{fill:var(--muted);font:500 13px "IBM Plex Sans",sans-serif}

/* scans */
.scan{margin-bottom:16px}
.scan-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 16px 4px}
.scan-h h3{margin:0;font-size:21px}
.scan-h .c{font-size:18px}
.scan-h p{margin:0;color:var(--muted);font-size:15px;flex-basis:100%}
.empty{padding:14px 16px;color:var(--muted)}
.err{padding:20px;border:2px solid var(--down);border-radius:8px;background:var(--panel)}

/* VPCI screener */
.vbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.vbar a{color:var(--sel);font-weight:600}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.subtabs button{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:16px}
.subtabs button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:12px}
.metric{padding:10px 14px}
.metric .k{color:var(--muted);font-size:15px}
.metric .v{font-size:30px;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.badge{display:inline-block;padding:3px 12px;border-radius:14px;font-size:15px;font-weight:600;border:1.5px solid var(--up);color:var(--up)}
.badge.off{border-color:var(--down);color:var(--down)}
.caption{color:var(--muted);font-size:16px;margin:0 2px 12px;max-width:78ch}
.vt td,.vt th{font-size:15px;padding:7px 9px}
.vt td.b-t{color:var(--up);font-weight:700}.vt td.b-f{color:var(--down)}
.vt td.sym{text-align:left}
.vt td.txt{text-align:left;white-space:normal;min-width:120px;max-width:340px}
details.exp{margin:12px 0;background:var(--panel);border:1.5px solid var(--rule);border-radius:8px}
details.exp>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.exp>div{padding:0 0 8px}
.dl{background:none;border:1.5px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;margin:8px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols2 h4{margin:4px 0 6px;font-size:18px}
.warnbox{border:2px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:var(--panel)}
@media (max-width:800px){.cols2{grid-template-columns:1fr}}
@media (max-width:640px){
  :root{--fs:16px}
  h1{font-size:26px}
  .brow{grid-template-columns:1fr 78px 52px;gap:6px 10px;padding:9px 12px}
  .btrack{grid-column:1/-1;grid-row:2}
  .bname{font-size:17px}
  nav.tabs button{padding:10px 12px;font-size:17px}
  .filters input[type=search]{width:100%}
  .gauges{grid-template-columns:1fr 1fr}
  .seg button{padding:8px 10px}
  .controls>div{max-width:100%}
  .gauge .v{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .35s ease, left .35s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>PKC Sector Radar</h1>
      <div class="asof" id="asof">Loading data…</div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Switch theme</button>
  </header>
  <div class="readouts" id="readouts"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="rot" aria-selected="true">Rotation</button>
    <button role="tab" data-v="br" aria-selected="false">Breadth</button>
    <button role="tab" data-v="rs" aria-selected="false">RS ranking</button>
    <button role="tab" data-v="sc" aria-selected="false">Scanners</button>
    <button role="tab" data-v="vp" aria-selected="false">VPCI Screener</button>
  </nav>
  <main id="view"></main>
</div>

<script>
const PERIODS=["1D","1W","1M","3M","6M","YTD","1Y"];
const PLABEL={"1D":"Today","1W":"1W","1M":"1M","3M":"3M","6M":"6M","YTD":"YTD","1Y":"1Y"};
const st={tab:"rot",period:"1M",group:"Themes",agg:"mean",sort:"ret",open:null,
  rs:{q:"",sec:"",theme:"",min:0,tt:false,s2:false,a50:false,key:"rs",dir:-1,show:100}};
let D={};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2,sign=true)=>v==null||!isFinite(v)?"–":(sign&&v>0?"+":"")+v.toFixed(d)+"%";
const cls=v=>v==null?"":v>0?"up":v<0?"down":"";
const tv=s=>`https://www.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(s)}`;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function seg(name,opts,cur,labels){
  return `<div class="seg" role="group" aria-label="${name}">`+opts.map(o=>
    `<button type="button" data-seg="${name}" data-val="${o}" aria-pressed="${o===cur}">${esc(labels?labels[o]:o)}</button>`).join("")+`</div>`;
}

/* ---------- data ---------- */
async function load(){
  if(window.EMBED){D=window.EMBED;return;}
  const get=n=>fetch(`data/${n}.json?v=${Date.now()}`).then(r=>{if(!r.ok)throw new Error(n+".json "+r.status);return r.json()});
  const [meta,stocks,groups,breadth,scans]=await Promise.all(["meta","stocks","groups","breadth","scans"].map(get));
  D={meta,stocks,groups,breadth,scans};
}
function index(){
  D.by=Object.fromEntries(D.stocks.map(s=>[s.s,s]));
  D.themesOf={};
  for(const [t,syms] of Object.entries(D.groups.Themes||{})) for(const s of syms)(D.themesOf[s]=D.themesOf[s]||[]).push(t);
}

/* ---------- header ---------- */
function renderHead(){
  const m=D.meta;
  $("#asof").textContent=`Prices as of ${m.asof} · updated ${m.generated} · ${m.universe} stocks in universe · source ${m.source==="upstox"?"Upstox":m.source==="yahoo"?"Yahoo (backup)":m.source}`;
  $("#readouts").innerHTML=Object.entries(m.indices||{}).map(([k,v])=>{
    const r=v.r[st.period];
    return `<div class="ro"><div class="k">${esc(k)} · ${PLABEL[st.period]}</div><div class="v num ${cls(r)}">${fmt(r)}</div></div>`;
  }).join("");
}

/* ---------- rotation ---------- */
function groupStats(prev){
  const g=D.groups[st.group]||{},key=prev?"rp":"r",out=[];
  for(const [name,syms] of Object.entries(g)){
    const vals=syms.map(s=>D.by[s]?.[key]?.[st.period]).filter(v=>v!=null&&isFinite(v));
    if(vals.length<(D.meta.min_group_size||3))continue;
    const live=syms.filter(s=>D.by[s]);
    const a50=live.filter(s=>D.by[s].a50!=null);
    out.push({name,n:vals.length,v:st.agg==="mean"?mean(vals):median(vals),
      adv:vals.filter(v=>v>0).length/vals.length*100,
      br:a50.length?a50.filter(s=>D.by[s].a50).length/a50.length*100:null,syms:live});
  }
  return out;
}
function renderRot(){
  const now=groupStats(false),prev=groupStats(true);
  const prank={};[...prev].sort((a,b)=>b.v-a.v).forEach((g,i)=>prank[g.name]=i+1);
  const ranked=[...now].sort((a,b)=>b.v-a.v);ranked.forEach((g,i)=>g.rank=i+1);
  let rows=ranked;
  if(st.sort==="name")rows=[...now].sort((a,b)=>a.name.localeCompare(b.name));
  if(st.sort==="br")rows=[...now].sort((a,b)=>(b.br??-1)-(a.br??-1));
  const mx=Math.max(1,...now.map(g=>Math.abs(g.v)));
  const showRank=st.period!=="1D";
  let h=`<div class="controls">
    <div><span class="ctl-label">Period</span>${seg("period",PERIODS,st.period,PLABEL)}</div>
    <div><span class="ctl-label">Group by</span>${seg("group",Object.keys(D.groups),st.group)}</div>
    <div><span class="ctl-label">Average</span>${seg("agg",["mean","median"],st.agg,{mean:"Mean",median:"Median"})}</div>
    <div><span class="ctl-label">Sort</span>${seg("sort",["ret","br","name"],st.sort,{ret:"Return",br:"Breadth",name:"A–Z"})}</div>
  </div><div class="panel bars">`;
  if(!rows.length)h+=`<div class="empty">No group has ${D.meta.min_group_size}+ stocks with data for this period.</div>`;
  for(const g of rows){
    const w=Math.abs(g.v)/mx*50,left=g.v>=0?50:50-w;
    const pr=prank[g.name],dr=pr?pr-g.rank:0;
    const rk=!showRank||!pr?"":dr>0?`<span class="rk gain" title="Rank 1 week ago: ${pr}">▲${dr}</span>`:dr<0?`<span class="rk loss" title="Rank 1 week ago: ${pr}">▼${-dr}</span>`:`<span class="rk" title="Rank unchanged">=</span>`;
    const open=st.open===g.name;
    h+=`<div class="brow" tabindex="0" role="button" aria-expanded="${open}" data-g="${esc(g.name)}">
      <div class="bname">${esc(g.name)}<span class="cnt">${g.n}</span></div>
      <div class="btrack"><div class="zero"></div><div class="fill ${cls(g.v)}" style="left:${left}%;width:${w}%"></div></div>
      <div class="bval num ${cls(g.v)}">${fmt(g.v)}</div>${rk||"<span></span>"}
      ${open?`<div class="bsub">${g.adv.toFixed(0)}% of stocks up over ${PLABEL[st.period]} · ${g.br==null?"–":g.br.toFixed(0)+"%"} above 50 DMA</div><div class="members">${memberTable(g.syms)}</div>`:""}
    </div>`;
  }
  h+=`</div><p class="note">Bars are the ${st.agg} return of the stocks in each group. Arrows show rank change against the same calculation one week ago. Click a group to see its stocks.</p>`;
  $("#view").innerHTML=h;
}
function memberTable(syms){
  const rows=syms.map(s=>D.by[s]).sort((a,b)=>(b.r[st.period]??-999)-(a.r[st.period]??-999));
  return `<div class="tscroll"><table><thead><tr><th class="l">Stock</th><th>${PLABEL[st.period]}</th><th>Price</th><th>RS</th><th>From 52W high</th><th>Stage</th><th>Vol ×</th></tr></thead><tbody>`+
  rows.map(x=>`<tr><td class="sym"><a href="${tv(x.s)}" target="_blank" rel="noopener">${esc(x.s)}</a><span class="nm">${esc(x.n)}</span></td>
    <td class="num ${cls(x.r[st.period])}">${fmt(x.r[st.period])}</td><td class="num">${x.px?.toLocaleString("en-IN")}</td>
    <td class="num">${x.rs??"–"}</td><td class="num ${cls(x.h52)}">${fmt(x.h52,1)}</td><td>${stagePill(x.st)}</td><td class="num">${x.vr==null?"–":x.vr.toFixed(1)}</td></tr>`).join("")+
  `</tbody></table></div>`;
}
const secOf=x=>x.ind||x.sec||"–";
function stagePill(s){return s?`<span class="pill st${s}">${s===2?"Stage 2":s===4?"Stage 4":s===1?"Base":"Top/basing"}</span>`:"–"}

/* ---------- breadth ---------- */
function lineChart(series,opts){
  const W=1000,H=opts.h||300,pl=44,pr=opts.right?58:14,pt=12,pb=28;
  const n=D.breadth.dates.length,x=i=>pl+i*(W-pl-pr)/(n-1);
  const y=(v,lo,hi)=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g="";
  for(const t of opts.ticks){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t,opts.lo,opts.hi)}" y2="${y(t,opts.lo,opts.hi)}" stroke="var(--track)" stroke-width="${t===opts.mid?2:1}"/><text x="${pl-6}" y="${y(t,opts.lo,opts.hi)+4}" text-anchor="end">${t}${opts.unit||""}</text>`}
  const step=Math.ceil(n/6);
  for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${D.breadth.dates[i].slice(2,7)}</text>`;
  for(const s of series){
    const lo=s.lo??opts.lo,hi=s.hi??opts.hi;
    if(s.bars){const bw=Math.max(1,(W-pl-pr)/n-1),y0=y(0,lo,hi);
      s.data.forEach((v,i)=>{if(v==null)return;const yy=y(v,lo,hi);g+=`<rect x="${x(i)-bw/2}" y="${Math.min(yy,y0)}" width="${bw}" height="${Math.abs(yy-y0)}" fill="${v>=0?"var(--up)":"var(--down)"}"/>`});continue;}
    const pts=s.data.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v,lo,hi).toFixed(1)}`).filter(Boolean).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
}
function renderBr(){
  const b=D.breadth,L=b.dates.length-1,P=Math.max(0,L-5);
  const tile=(k,lab)=>{const v=b[k][L],d=v-b[k][P];
    return `<div class="panel gauge"><div class="k">${lab}</div><div class="v num">${v.toFixed(1)}%</div>
    <div class="d num ${cls(d)}">${d>0?"+":""}${d.toFixed(1)} pts vs 1W ago</div><div class="gbar"><i style="width:${v}%"></i></div></div>`};
  const sum=k=>b[k].slice(-5).reduce((x,y)=>x+y,0);
  let h=`<div class="gauges">${tile("a20","Above 20 DMA")}${tile("a50","Above 50 DMA")}${tile("a200","Above 200 DMA")}
    <div class="panel gauge"><div class="k">Advance / decline today</div><div class="v num"><span class="up">${b.adv[L]}</span> / <span class="down">${b.dec[L]}</span></div>
      <div class="d">Ratio ${(b.adv[L]/Math.max(1,b.dec[L])).toFixed(2)} · 5-day ${sum("adv")} / ${sum("dec")}</div></div>
    <div class="panel gauge"><div class="k">52W highs / lows today</div><div class="v num"><span class="up">${b.nh[L]}</span> / <span class="down">${b.nl[L]}</span></div>
      <div class="d">5-day ${sum("nh")} / ${sum("nl")}</div></div>

const VP={mode:"completed",prorate:true,tab:"fresh",cache:{},rot:null,sort:{},show:{}};

  ["rank","🏆 Ranked"],["g4","🎯 G4 Pending"],["young","🌱 New Listings"],["sect","🏭 Sector Leadership"],["rotn","📈 Sector Rotation"]];
async function vpLoad(mode){
  if(window.EMBED_VP)return window.EMBED_VP[mode];
  if(!VP.cache[mode]){const r=await fetch(`data/vpci/${mode}.json?v=${Date.now()}`);if(!r.ok)throw new Error(`vpci/${mode}.json ${r.status}`);VP.cache[mode]=await r.json();}

}
async function vpRot(){
  if(window.EMBED_VP)return window.EMBED_VP.rotation;

  return VP.rot;
}
const tvx=(sym,ex)=>`https://in.tradingview.com/chart/?symbol=${encodeURIComponent((ex||"NSE")+":"+sym)}`;
function toObjs(t){return (t?.rows||[]).map(r=>Object.fromEntries(t.columns.map((c,i)=>[c,r[i]])))}
function fmtCell(c,v){
  if(v===null||v===undefined||v==="")return ["","–"];
  if(typeof v==="boolean")return [v?"b-t":"b-f",v?"✓":"✗"];
  if(typeof v==="number"){
    const d=/^score_|composite/.test(c)?3:(c==="vpci"||c==="vpci_signal")?4:Number.isInteger(v)?0:2;
    return ["num",d===0&&Math.abs(v)>=1000?v.toLocaleString("en-IN"):v.toFixed(d)];
  }
  return ["txt",String(v)];
}
function vtable(id,rows,cols,opts={}){
  if(!rows.length)return `<div class="empty">${esc(opts.empty||"No rows.")}</div>`;
  cols=cols||Object.keys(rows[0]);
  const s=VP.sort[id];
  if(s){rows=[...rows].sort((a,b)=>{const A=a[s.k],B=b[s.k];if(A==null)return 1;if(B==null)return -1;return typeof A==="string"?s.d*A.localeCompare(B):s.d*(A-B)})}
  const lim=VP.show[id]||100,vis=rows.slice(0,lim);
  let h=`<div class="tscroll vt"><table data-tid="${id}"><thead><tr>${cols.map(c=>`<th class="${c==="symbol"||c==="Company Name"||c==="status"?"l":""}" data-k="${esc(c)}" tabindex="0">${esc(c)}${s&&s.k===c?(s.d<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of vis){h+="<tr>"+cols.map(c=>{
    if(c==="symbol")return `<td class="sym"><a href="${tvx(r.symbol,r.exchange)}" target="_blank" rel="noopener">${esc(r.symbol)}</a></td>`;
    const [k,t]=fmtCell(c,r[c]);return `<td class="${k}">${esc(t)}</td>`}).join("")+"</tr>"}
  h+=`</tbody></table></div>`;
  if(rows.length>lim)h+=`<button class="more" type="button" data-more="${id}">Show ${Math.min(100,rows.length-lim)} more of ${rows.length-lim} remaining</button>`;
  h+=`<button class="dl" type="button" data-dl="${id}">📥 Download CSV (${rows.length} rows)</button>`;
  VP.tables=VP.tables||{};VP.tables[id]={rows,cols};
  return h;
}
function csvOf(id){const {rows,cols}=VP.tables[id];const q=v=>v==null?"":/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:String(v);
  return [cols.join(",")].concat(rows.map(r=>cols.map(c=>q(r[c])).join(","))).join("\n")}
function lead(rows,first){const all=rows.length?Object.keys(rows[0]):[];return first.filter(c=>all.includes(c)).concat(all.filter(c=>!first.includes(c)))}
function uiCols(rows){ // app.py: Market Cap moved right after Company Name
  let c=rows.length?Object.keys(rows[0]):[];if(c.includes("Market Cap")){c=c.filter(x=>x!=="Market Cap");const i=c.includes("Company Name")?c.indexOf("Company Name")+1:c.indexOf("symbol")+1;c.splice(i,0,"Market Cap")}return c}
async function renderVp(){

  if(failed.length)h+=`<details class="exp"><summary>⚠️ ${failed.length} symbols not found on any source (Upstox → Kite → Yahoo)</summary><div style="padding:6px 14px 10px">${failed.map(esc).join(", ")}</div></details>`;

  $("#vpBody").innerHTML=h;

async function vpTab(d,res,yng){

      :`<div class="empty panel">No stocks meet the strict G4-pending criteria this week (all 6 other gates passing, only G4 missing).</div>`;}

      h+=`<div class="metrics"><div class="panel metric"><div class="k">🌱 Young stocks scanned</div><div class="v num">${yng.length}</div></div><div class="panel metric"><div class="k">✅ Accumulating (G5-style)</div><div class="v num">${acc.length}</div></div><div class="panel metric"><div class="k">📈 Above 13w EMA</div><div class="v num">${yng.filter(r=>r.above_13ema).length}</div></div></div>`;
      h+=`<h4>✅ Accumulating — VPCI &gt; 0, above signal, rising</h4>`+(acc.length?vtable("yacc",acc):`<div class="empty panel">None of the young listings show VPCI accumulation this week.</div>`);
      h+=`<details class="exp"><summary>All young listings (including non-accumulating)</summary><div>${vtable("yall",yng)}</div></details>`;}
  }else if(t==="sect"){
    const S=d.sector||{},both=toObjs(S.sector_both),ind=toObjs(S.industry_both);
    h+=`<h3>🏭 Leading Sectors &amp; Industries — G5 (VPCI) + G6 (Leader RS) + G7 (Above 40w)</h3><p class="caption">Sectors and industries ranked by the count of stocks where the institutional confirmation gates fire together. G5 = VPCI accumulation; G6 = leader RS positive vs index; G7 = price above the 40-week MA (Stage 2 trend). When several constituents of the same sector pass all three, accumulation, relative strength and trend are aligned — the highest-conviction sector for fresh capital this week.</p>`;
    const tot=both.reduce((a,r)=>a+(r.stocks_passing||0),0);
    if(!both.length||!tot)h+=`<div class="empty panel">No stocks pass G5, G6 and G7 together in this scan.</div>`;
    else{h+=`<div class="metrics"><div class="panel metric"><div class="k">Stocks passing G5 ∧ G6 ∧ G7</div><div class="v num">${tot}</div></div><div class="panel metric"><div class="k">Sectors with ≥1 leader</div><div class="v num">${both.filter(r=>r.stocks_passing>0).length}</div></div><div class="panel metric"><div class="k">Top sector</div><div class="v" style="font-size:22px">${esc(both[0].sector)}</div><div class="k">${both[0].stocks_passing} stocks</div></div></div>`;
      h+=`<div class="cols2"><div><h4>🥇 Sectors — G5 ∧ G6 ∧ G7 (strict)</h4><p class="caption">All three gates passing — institutional confirmation cut.</p>${vtable("sb",both.slice(0,20))}</div>
        <div><h4>🏷️ Industries — G5 ∧ G6 ∧ G7 (strict)</h4><p class="caption">Drill-down within sectors — the actual sub-theme leading.</p>${vtable("ib",ind.slice(0,20))}</div></div>`;
      h+=`<details class="exp"><summary>📊 Broader breadth — Sectors / Industries with G5 ∨ G6 ∨ G7 firing</summary><div><p class="caption" style="padding:0 14px">A wider net for early sector accumulation: stocks passing any of the three institutional gates — spots sectors just starting to rotate.</p><div class="cols2"><div>${vtable("se",toObjs(S.sector_either).slice(0,20))}</div><div>${vtable("ie",toObjs(S.industry_either).slice(0,20))}</div></div></div></details>`;
      h+=`<details class="exp"><summary>🔬 Stock-level view — every passer with sector tags</summary><div>${vtable("stk",toObjs(S.stock_table))}</div></details>`;}
  }else if(t==="rotn"){
    const R=await vpRot();
    h+=`<h3>📈 Sector Rotation — Week-Over-Week History</h3><p class="caption">Counts of stocks passing G5 ∧ G6 ∧ G7 per sector across saved weekly snapshots. A sector accelerating from 2 → 5 → 9 leaders over three weeks is rotating in; a decaying one is rotating out. One snapshot is saved per week by the evening job.</p>`;
    const rows=toObjs(R.table);
    if(!rows.length)h+=`<div class="empty panel">No history yet. Each week adds a column here.</div>`;
    else{const cols=R.table.columns,weeks=cols.slice(1),mx=Math.max(1,...rows.flatMap(r=>weeks.map(w=>r[w]||0)));
      h+=`<p class="caption">Loaded ${R.weeks} weekly snapshot(s).</p><div class="tscroll vt panel"><table><thead><tr><th class="l">sector</th>${weeks.map(w=>`<th>${esc(w)}</th>`).join("")}</tr></thead><tbody>`+
        rows.map(r=>`<tr><td class="l">${esc(r.sector)}</td>${weeks.map(w=>{const v=r[w]||0,f=v/mx;return `<td class="num" style="${v>0?`background:color-mix(in srgb,var(--up) ${Math.round(15+60*f)}%,transparent);font-weight:700`:""}">${v}</td>`}).join("")}</tr>`).join("")+`</tbody></table></div>`;
      if(R.rot_in||R.rot_out)h+=`<div class="cols2" style="margin-top:12px"><div class="panel" style="padding:10px 14px"><h4>🚀 Rotating IN (week-over-week)</h4>${(R.rot_in||[]).map(([s,v])=>`<div>${esc(s)} <b class="up">+${v}</b></div>`).join("")||"–"}</div><div class="panel" style="padding:10px 14px"><h4>🪂 Rotating OUT (week-over-week)</h4>${(R.rot_out||[]).map(([s,v])=>`<div>${esc(s)} <b class="down">${v}</b></div>`).join("")||"–"}</div></div>`;}
  }
  box.innerHTML=h;
  box.querySelectorAll("th[data-k]").forEach(th=>{const tid=th.closest("table").dataset.tid;const go=()=>{const k=th.dataset.k,s=VP.sort[tid];VP.sort[tid]={k,d:s&&s.k===k?-s.d:-1};vpTab(d,res,yng)};th.addEventListener("click",go);th.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});
  box.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{VP.show[b.dataset.more]=(VP.show[b.dataset.more]||100)+100;vpTab(d,res,yng)}));
  box.querySelectorAll("[data-dl]").forEach(b=>b.addEventListener("click",()=>{const blob=new Blob([csvOf(b.dataset.dl)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`vpci_${d.mode}_${b.dataset.dl}_${(d.scan_time||"").slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove()}));
}

/* ---------- wiring ---------- */
function render(){renderHead();({rot:renderRot,br:renderBr,rs:renderRs,sc:renderSc,vp:renderVp})[st.tab]()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.tab=b.dataset.v;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
$("#view").addEventListener("click",e=>{
  const s=e.target.closest("[data-seg]");
  if(s&&s.dataset.seg==="vpmode"){VP.mode=s.dataset.val;VP.sort={};VP.show={};renderVp();return;}
  if(s&&s.dataset.seg==="vpprorate"){VP.prorate=s.dataset.val==="on";VP.sort={};VP.show={};renderVp();return;}
  if(s){st[s.dataset.seg]=s.dataset.val;if(s.dataset.seg==="group")st.open=null;render();return;}
  const vt=e.target.closest("[data-vtab]");if(vt){VP.tab=vt.dataset.vtab;document.querySelectorAll("[data-vtab]").forEach(b=>b.setAttribute("aria-pressed",b===vt));vpLoad(VP.mode==="running"&&!VP.prorate?"running_raw":VP.mode).then(d=>vpTab(d,toObjs(d.results),toObjs(d.young)));return;}
  if(e.target.closest("#vpBody"))return;
  if(e.target.closest(".members"))return;
  const r=e.target.closest(".brow");if(r){st.open=st.open===r.dataset.g?null:r.dataset.g;renderRot();}
});
$("#view").addEventListener("keydown",e=>{const r=e.target.closest?.(".brow");if(r&&e.target===r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();st.open=st.open===r.dataset.g?null:r.dataset.g;renderRot();
  document.querySelector(`.brow[data-g="${CSS.escape(r.dataset.g)}"]`)?.focus()}});
$("#themeBtn").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  d.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("radar-theme",d.dataset.theme)}catch(e){}});
try{const t=localStorage.getItem("radar-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}

load().then(()=>{index();render()}).catch(err=>{
  $("#asof").textContent="";
  $("#view").innerHTML=`<div class="err"><b>Data files could not be loaded.</b><br>${esc(err.message)}. The daily job may not have run yet. Open the Actions tab on GitHub, run “Daily update” once, then reload this page.</div>`;
});
</script>
</body>
