<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PKC Sector Radar</title>
<meta name="theme-color" content="#10233D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy market band (brand + pulse hero) on top, sticky tab bar (bottom bar on phones),
   white working cards on a cool-grey desk. One accent (marigold) marks the active place. */
:root{
  --desk:#EEF1F5; --card:#FFFFFF; --soft:#F5F7FA; --ink:#0F1A2A; --muted:#4D5868; --line:#D6DCE4; --track:#E4E9EF;
  --band:#10233D; --band2:#183253; --band-ink:#FFFFFF; --band-muted:#B9C6D8; --band-line:#2B4468;
  --accent:#E3A13A; --accent-ink:#8A5A00;
  --sel:#10233D; --sel-ink:#FFFFFF;
  --up:#0E8A6E; --down:#D4462C; --up-t:#0B6E58; --down-t:#B33A22;
  --s1:#1F5FAE; --s2:#C77D0A; --warn:#8A5A00; --warn-bg:#FFF6E3;
  --shadow:0 1px 2px rgba(15,26,42,.06),0 4px 14px rgba(15,26,42,.05);
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:17px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0B111B; --card:#141E2C; --soft:#1A2638; --ink:#EDF1F6; --muted:#A9B6C8; --line:#263347; --track:#223044;
  --band:#0A1524; --band2:#112035; --band-ink:#EDF1F6; --band-muted:#9FB0C6; --band-line:#22344F;
  --accent:#F0B456; --accent-ink:#F0B456; --sel:#DCE7F5; --sel-ink:#0B111B;
  --up:#1FA184; --down:#E35A3A; --up-t:#45C4A6; --down-t:#FF8A6E;
  --s1:#4C8BD8; --s2:#BF7F25; --warn:#F2C14E; --warn-bg:#2A2312;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --desk:#0B111B; --card:#141E2C; --soft:#1A2638; --ink:#EDF1F6; --muted:#A9B6C8; --line:#263347; --track:#223044;
  --band:#0A1524; --band2:#112035; --band-ink:#EDF1F6; --band-muted:#9FB0C6; --band-line:#22344F;
  --accent:#F0B456; --accent-ink:#F0B456; --sel:#DCE7F5; --sel-ink:#0B111B;
  --up:#1FA184; --down:#E35A3A; --up-t:#45C4A6; --down-t:#FF8A6E;
  --s1:#4C8BD8; --s2:#BF7F25; --warn:#F2C14E; --warn-bg:#2A2312;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--desk);color:var(--ink);font:400 var(--fs)/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1260px;margin:0 auto;padding-inline:20px}
.up{color:var(--up-t)} .down{color:var(--down-t)}
h1,h2,h3,h4{font-family:var(--display);font-stretch:108%;margin:0;line-height:1.15;text-wrap:balance}
[hidden]{display:none!important}

/* ── Global stock search (in the band) ───────────────────── */
.gsearch{position:relative;flex:1;max-width:560px;margin-inline:auto}
.gsearch>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--band-muted);pointer-events:none}
.gsearch input{width:100%;min-height:48px;padding:0 48px 0 46px;border-radius:999px;border:1.5px solid var(--band-line);background:rgba(255,255,255,.08);color:var(--band-ink);font:inherit;font-size:17px;font-weight:500}
.gsearch input::placeholder{color:var(--band-muted);opacity:1}
.gsearch input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.13)}
.gsearch input::-webkit-search-cancel-button{display:none}
.gsearch kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 13px/1 inherit;color:var(--band-muted);border:1px solid var(--band-line);border-radius:6px;padding:4px 8px}
.qres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px rgba(5,15,30,.32);z-index:70;max-height:min(70vh,560px);overflow:auto;padding:6px}
.qres .opt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 14px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:inherit;font:inherit}
.qres .opt[aria-selected="true"],.qres .opt:hover{background:var(--soft)}
.qres .opt b{font-size:17px;font-weight:700;letter-spacing:.01em}
.qres .opt .nm{grid-column:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qres .opt .rt{grid-row:1/3;grid-column:2;text-align:right;font-size:15px}
.qres .opt .rt small{display:block;font-size:13px;color:var(--muted)}
.qres .opt mark{background:none;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.qres .up{color:var(--up-t)}.qres .down{color:var(--down-t)}
.qres .none{padding:14px;color:var(--muted);font-size:15px}
.qres .hint{padding:8px 12px 4px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}

/* ── Band: brand + market pulse ─────────────────────────── */
.band{background:linear-gradient(180deg,var(--band) 0%,var(--band2) 100%);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:24px;letter-spacing:.01em}
.brand span{display:block;font-size:14px;color:var(--band-muted);font-weight:500;margin-top:1px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--band-line);background:transparent;color:var(--band-ink);cursor:pointer;font-size:15px;font-weight:600}
.iconbtn:hover{border-color:var(--band-muted)}
.pulse{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr);gap:18px;padding-block:14px 22px}
.hero-idx{background:rgba(255,255,255,.04);border:1px solid var(--band-line);border-radius:14px;padding:16px 18px 10px;min-width:0}
.hero-idx .lab{display:flex;justify-content:space-between;gap:8px;color:var(--band-muted);font-size:15px;font-weight:600}
.hero-idx .val{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:44px;line-height:1.05;margin-top:6px}
.hero-idx .chg{font-size:20px;font-weight:700;margin-left:10px}
.band .up{color:#5FD6B3} .band .down{color:#FF9479}
.spark{display:block;width:100%;height:76px;margin-top:6px}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2}
.spark path.a{fill:var(--accent);opacity:.12}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.mini{display:flex;justify-content:space-between;gap:6px;font-size:15px;color:var(--band-muted);border-top:1px solid var(--band-line);padding-top:7px}
.mini b{color:var(--band-ink);font-weight:600}
.health{background:rgba(255,255,255,.04);border:1px solid var(--band-line);border-radius:14px;padding:16px 18px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 22px;align-content:start}
.verdict{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.verdict .k{color:var(--band-muted);font-size:15px;font-weight:600}
.verdict .v{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:30px}
.verdict .why{color:var(--band-muted);font-size:15px}
.hm .k{display:flex;justify-content:space-between;font-size:15px;color:var(--band-muted)}
.hm .k b{color:var(--band-ink);font-size:17px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--band-line);margin-top:7px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.meter.split i{background:#33B892} .meter.split i+i{left:auto;right:0;background:#F06A4D}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--band-ink);opacity:.55}

/* ── Tabs ─────────────────────────────────────────────── */
.tabbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tabbar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabbar .wrap::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:9px;padding:15px 16px 13px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent}
.tab svg{width:21px;height:21px;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .cnt{font-size:13px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}

main.wrap{padding-block:22px 40px;min-height:60vh}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.sec-head h2{font-size:28px;font-weight:800}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;padding:14px 16px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl>span{font-size:14px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.select,.search{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;min-height:42px;max-width:100%}
.search{width:240px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;min-height:42px}
.check input{width:20px;height:20px;accent-color:var(--sel)}
.note{color:var(--muted);font-size:15px;margin:12px 2px 0;max-width:90ch}
.empty{padding:22px 18px;color:var(--muted)}
.err{padding:18px 20px;border:2px solid var(--down);border-radius:var(--r);background:var(--card)}
.warnbox{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}

/* pills */
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;border:1.5px solid currentColor;line-height:1.5}
.p-up{color:var(--up-t)} .p-down{color:var(--down-t)} .p-mut{color:var(--muted)} .p-acc{color:var(--accent-ink)}
.rs{display:inline-block;min-width:38px;text-align:center;padding:1px 6px;border-radius:6px;font-weight:700;font-size:15px}
.rs-a{background:var(--up);color:#fff} .rs-b{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up-t)} .rs-c{background:var(--soft);color:var(--muted)} .rs-d{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down-t)}

/* ── Rotation ─────────────────────────────────────────── */
.rows{padding:4px 0}
.brow{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(0,2.3fr) 92px 58px;align-items:center;gap:6px 14px;padding:10px 18px;cursor:pointer;border-top:1px solid var(--track)}
.brow:first-child{border-top:0}
.brow:hover{background:var(--soft)}
.brow[aria-expanded="true"]{background:var(--soft)}
.bname{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.bname .cnt{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
.bname .lead{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{position:relative;height:24px}
.btrack .zero{position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--muted);opacity:.6}
.btrack .fill{position:absolute;top:4px;bottom:4px}
.fill.pos{background:var(--up);border-radius:0 4px 4px 0} .fill.neg{background:var(--down);border-radius:4px 0 0 4px}
.bval{text-align:right;font-size:19px;font-weight:700}
.rk{font-size:15px;font-weight:600;text-align:right;color:var(--muted)}
.rk.gain{color:var(--up-t)} .rk.loss{color:var(--down-t)}
.members{grid-column:1/-1;cursor:default;padding:4px 0 8px}
.members .meta{font-size:15px;color:var(--muted);margin:2px 0 8px}
.heat{width:100%;border-collapse:separate;border-spacing:0}
.heat th{font-size:14px;color:var(--muted);font-weight:600;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);cursor:pointer}
.heat th:first-child{text-align:left;padding-left:16px}
.heat td{padding:3px;text-align:center}
.heat td:first-child{text-align:left;padding:8px 16px;font-weight:600;white-space:nowrap}
.heat .cell{border-radius:6px;padding:8px 4px;font-weight:600;font-size:15px;min-width:64px}
.heat tr.hr{cursor:pointer}.heat tr.hr:hover td:first-child{text-decoration:underline}
.heat th.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}

/* ── Tables ───────────────────────────────────────────── */
.tscroll{overflow:auto;max-height:74vh;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:16px}
.dt th,.dt td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--track)}
.dt th{font-size:14px;font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--card);z-index:2;cursor:pointer;user-select:none}
.dt th:hover{color:var(--ink)}
.dt th.l,.dt td.l{text-align:left}
.dt td.wrapcell{white-space:normal;min-width:160px;max-width:300px;text-align:left}
.dt th:first-child,.dt td:first-child{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;box-shadow:1px 0 0 var(--track)}
.dt th:first-child{z-index:3}
.dt tbody tr:hover td{background:var(--soft)}
.symbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:2px}
.symbtn:hover{text-decoration-color:var(--accent)}
.nm{display:block;font-size:14px;color:var(--muted);font-weight:400;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tfoot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--muted);font-size:15px;border-top:1px solid var(--track)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:15px}
.ghost:hover{border-color:var(--muted)}

/* ── Breadth ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{padding:14px 16px}
.tile .k{color:var(--muted);font-size:15px;font-weight:600}
.tile .v{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:34px;line-height:1.15;margin-top:2px}
.tile .d{font-size:15px;margin-top:2px}
.tile .bar{height:8px;border-radius:4px;background:var(--track);margin-top:10px;position:relative;overflow:hidden}
.tile .bar i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:4px}
.chart{padding:14px 14px 8px;margin-bottom:14px;position:relative}
.chart h3{font-size:19px;margin:2px 4px 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted);margin:4px 4px 6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 9px)}
svg text{fill:var(--muted);font:500 13px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{font-weight:700}

/* ── Scanners ─────────────────────────────────────────── */
.scan-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding:8px 0}
.rail h4{font-size:14px;font-weight:700;color:var(--muted);font-family:var(--body);padding:12px 16px 4px;letter-spacing:.02em}
.rail button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;border:0;background:none;padding:8px 16px;text-align:left;cursor:pointer;font-size:16px;color:var(--ink);border-left:3px solid transparent}
.rail button:hover{background:var(--soft)}
.rail button[aria-current="true"]{background:var(--soft);border-left-color:var(--accent);font-weight:700}
.rail button .c{font-size:14px;font-weight:700;min-width:30px;text-align:center;padding:0 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.rail button .c.z{opacity:.55}
.scan-pick{display:none}
.scan-head{padding:16px 18px 12px;border-bottom:1px solid var(--track)}
.scan-head h3{font-size:24px;font-weight:800}
.scan-head .cnt{font-family:var(--display);font-weight:800;font-size:24px;color:var(--accent-ink);margin-left:8px}
.scan-head p{margin:6px 0 0;color:var(--muted);max-width:80ch}
.catchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ── VPCI ─────────────────────────────────────────────── */
.vstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.funnel{padding:14px 16px;margin-bottom:12px}
.funnel h3{font-size:19px;margin-bottom:8px}
.frow{display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:4px 0;font-size:15px}
.frow .bar{height:16px;border-radius:0 4px 4px 0;background:var(--s1)}
.frow .lbl{color:var(--ink);font-weight:600}
.frow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.frow .n{text-align:right;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 12px;font-size:15px}
.badge{display:inline-block;padding:2px 11px;border-radius:999px;font-size:14px;font-weight:600;border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.badge.ok{border-color:var(--up);color:var(--up-t)} .badge.off{border-color:var(--down);color:var(--down-t)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:12px 0 12px;scrollbar-width:thin}
.subtabs button{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap}
.subtabs button .c{font-size:13px;color:var(--muted);margin-left:6px;font-weight:700}
.subtabs button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.subtabs button[aria-pressed="true"] .c{color:inherit;opacity:.8}
.gates{display:inline-flex;gap:3px;vertical-align:middle}
.gates i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.gates i.on{background:var(--up);border-color:var(--up)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.scard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.scard .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scard .sym{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:22px}
.scard .sym .symbtn{font-size:22px}
.scard .co{color:var(--muted);font-size:15px;line-height:1.3}
.scard .px{font-family:var(--display);font-weight:700;font-size:22px;text-align:right}
.scard dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin:0}
.scard dt{font-size:13px;color:var(--muted);font-weight:600}
.scard dd{margin:0;font-weight:700;font-size:16px}
.scard .state{font-size:15px;color:var(--muted)}
.vtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:10px}
.sbar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--s1);vertical-align:middle;margin-right:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 90px;gap:10px;align-items:center;padding:6px 0;font-size:15px;border-top:1px solid var(--track)}
.hbar:first-child{border-top:0}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--up)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
details.exp{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.exp>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.exp>div{padding:0 0 8px}

/* ── Drawer ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);z-index:61;box-shadow:-8px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:30px;font-weight:800}
.drawer .co{color:var(--muted);margin-top:2px}
.drawer .body{overflow:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer .close{border:1.5px solid var(--line);background:var(--card);border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:22px;flex:none}
.fscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.ftbl{width:100%;border-collapse:collapse;font-size:15px}
.ftbl th,.ftbl td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ftbl tr:last-child td{border-bottom:0}
.ftbl th:first-child,.ftbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.ftbl th{color:var(--muted);font-weight:600;font-size:13.5px;background:var(--soft)}
.flags{margin:8px 0 0;padding-left:20px;color:var(--down-t);font-weight:600}
.flags li{margin:3px 0}
.dsub{font-size:14px;color:var(--muted);margin:12px 0 0;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.dgrid div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.dgrid dt{font-size:13px;color:var(--muted);font-weight:600}
.dgrid dd{margin:0;font-weight:700;font-size:17px}
.dsec h4{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:15px;cursor:pointer;font-weight:600}
.chipbtn:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--sel);color:var(--sel-ink);font-weight:700;text-decoration:none;border:0;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}

footer.foot{color:var(--muted);font-size:15px;padding-block:6px 30px}
footer.foot p{margin:4px 0;max-width:110ch}

/* ── Responsive ───────────────────────────────────────── */
@media (max-width:1000px){
  .pulse{grid-template-columns:minmax(0,1fr)}
  .scan-layout{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .scan-pick{display:block;margin-bottom:12px}
  .vstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  :root{--fs:16px}
  .wrap{padding-inline:16px}
  .brand b{font-size:21px}
  .topbar{flex-wrap:wrap}
  .gsearch{order:3;flex-basis:100%;max-width:none;margin:4px 0 2px}
  .gsearch kbd{display:none}
  #themeBtn span{display:none}
  .topbar .brand{flex:1;min-width:0}
  #themeBtn{flex:none}
  #themeBtn{padding:0 12px}
  .hero-idx .val{font-size:36px}
  .health{grid-template-columns:minmax(0,1fr)}
  .verdict .v{font-size:27px}
  .tabbar{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar .wrap{padding-inline:4px;gap:0;justify-content:space-between}
  .tab{flex:1;flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:12.5px;border-bottom:0;border-top:3px solid transparent;min-width:0}
  .tab[aria-selected="true"]{border-top-color:var(--accent)}
  .tab .cnt{display:none}
  main.wrap{padding-bottom:110px}
  footer.foot{padding-bottom:110px}
  .sec-head h2{font-size:24px}
  .brow{grid-template-columns:minmax(0,1fr) 84px 46px;padding:10px 14px}
  .btrack{grid-column:1/-1;grid-row:2}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .v{font-size:28px}
  .search{width:100%}
  .toolbar .ctl{width:100%}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:120px minmax(0,1fr) 54px}
  .frow .lbl small{display:none}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer{top:auto;height:92vh;width:100%;border-radius:16px 16px 0 0}
}
@media (prefers-reduced-motion:no-preference){
  .fill,.meter i,.tile .bar i,.frow .bar{transition:width .35s ease,left .35s ease}
  .drawer{animation:slidein .22s ease}
  @keyframes slidein{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap topbar">
    <a class="brand" href="#rotation" aria-label="PKC Sector Radar home">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17.5" fill="none" stroke="#3E5C85" stroke-width="2"/><circle cx="20" cy="20" r="11" fill="none" stroke="#3E5C85" stroke-width="2"/><path d="M20 20 L33 9" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="25" r="2.6" fill="#5FD6B3"/><circle cx="13" cy="14" r="2" fill="#FF9479"/><circle cx="20" cy="20" r="2.4" fill="var(--accent)"/></svg>
      <div><b>PKC Sector Radar</b><span id="asof">Loading market data…</span></div>
    </a>
    <div class="gsearch" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 16l4.5 4.5"/></svg>
      <input id="gq" type="search" placeholder="Search any stock — symbol or company name" autocomplete="off" spellcheck="false"
        role="combobox" aria-label="Search stocks" aria-autocomplete="list" aria-controls="gqres" aria-expanded="false">
      <kbd aria-hidden="true">/</kbd>
      <div id="gqres" class="qres" role="listbox" aria-label="Matching stocks" hidden></div>
    </div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch light or dark theme">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span>Theme</span>
    </button>
  </div>
  <section class="wrap pulse" id="pulse" aria-label="Market pulse"></section>
</header>

<nav class="tabbar" aria-label="Sections">
  <div class="wrap" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="rotation" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h11v3H3zm0 5.5h16v3H3zM3 16h8v3H3z"/></svg>Rotation</button>
    <button class="tab" role="tab" data-v="breadth" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 13h4l2.5-6 4 11 2.5-6H21"/></svg>Breadth</button>
    <button class="tab" role="tab" data-v="rs" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 18l6-6 4 4 6-8M15 8h5v5"/></svg>RS ranking</button>
    <button class="tab" role="tab" data-v="scanners" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 16l4.5 4.5"/></svg>Scanners<span class="cnt" id="scanCnt"></span></button>
    <button class="tab" role="tab" data-v="vpci" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>VPCI screener</button>
  </div>
</nav>

<main class="wrap" id="view"><div class="empty">Loading…</div></main>

<footer class="wrap foot" id="foot"></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle"></aside>

<script>
/* ════════════════════ state & helpers ════════════════════ */
const PERIODS=["1D","1W","1M","3M","6M","YTD","1Y"];
const PL={"1D":"Today","1W":"1W","1M":"1M","3M":"3M","6M":"6M","YTD":"YTD","1Y":"1Y"};
const TABS=["rotation","breadth","rs","scanners","vpci"];
const st={tab:"rotation",period:"1M",group:"Themes",agg:"mean",sort:"ret",view:"bars",open:null,scan:"combo3",scanTop:0,scanFund:0,
  rs:{q:"",sec:"",theme:"",min:0,fmin:0,tt:false,s2:false,a50:false},tbl:{}};
let D={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=v=>typeof v==="number"&&isFinite(v);
const sgn=(v,d=2,u="%")=>!isNum(v)?"–":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+u;
const cls=v=>!isNum(v)?"":v>0?"up":v<0?"down":"";
const inr=v=>!isNum(v)?"–":v.toLocaleString("en-IN",{maximumFractionDigits:v>=1000?0:2});
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const store={get(k,d){try{const v=localStorage.getItem("radar."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("radar."+k,JSON.stringify(v))}catch(e){}}};
const tv=(s,ex)=>`https://in.tradingview.com/chart/?symbol=${encodeURIComponent((ex||"NSE")+":"+s)}`;
function seg(name,opts,cur,labels){return `<div class="seg" role="group" aria-label="${esc(name)}">`+opts.map(o=>`<button type="button" data-seg="${name}" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(labels?labels[o]:o)}</button>`).join("")+`</div>`}
function rsPill(v){if(!isNum(v))return "–";const c=v>=90?"rs-a":v>=70?"rs-b":v>=40?"rs-c":"rs-d";return `<span class="rs ${c}">${v}</span>`}
function stagePill(s){return !s?"–":s===2?`<span class="pill p-up">Stage 2</span>`:s===4?`<span class="pill p-down">Stage 4</span>`:s===1?`<span class="pill p-mut">Stage 1</span>`:`<span class="pill p-mut">Stage 3</span>`}
const symBtn=(s,n,ex)=>`<button type="button" class="symbtn" data-sym="${esc(s)}"${ex?` data-ex="${esc(ex)}"`:""}>${esc(s)}</button>${n?`<span class="nm">${esc(n)}</span>`:""}`;
function fmtDate(d){if(!d)return"";const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?String(d):t.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}

/* ════════════════════ data ════════════════════ */
async function load(){
  if(window.EMBED){D=window.EMBED;return}
  const get=n=>fetch(`data/${n}.json?v=${Date.now()}`).then(r=>{if(!r.ok)throw new Error(`${n}.json (${r.status})`);return r.json()});
  const [meta,stocks,groups,breadth,scans]=await Promise.all(["meta","stocks","groups","breadth","scans"].map(get));
  D={meta,stocks,groups,breadth,scans};
}
function index(){
  D.by=Object.fromEntries(D.stocks.map(s=>[s.s,s]));
  D.themesOf={};for(const [t,ss] of Object.entries(D.groups.Themes||{}))for(const s of ss)(D.themesOf[s]=D.themesOf[s]||[]).push(t);
  D.scansOf={};const sc=D.scans||{};
  if(sc.meta)for(const m of sc.meta)for(const s of (sc.hits[m.id]||[]))(D.scansOf[s]=D.scansOf[s]||[]).push(m.id);
  D.scanMeta=Object.fromEntries((sc.meta||[]).map(m=>[m.id,m]));
}

/* ════════════════════ header & pulse ════════════════════ */
function renderHeader(){
  const m=D.meta;
  $("#asof").textContent=`Prices to ${fmtDate(m.asof)} · updated ${m.generated.replace(/^\d{4}-\d{2}-\d{2} /,"")}`;
  const n=Object.values(D.scans?.hits||{}).filter(a=>a.length).length;$("#scanCnt").textContent=n||"";
}
function renderPulse(){
  const m=D.meta,b=D.breadth,L=b.dates.length-1,bn=b.bench_name,ix=m.indices||{},main=ix[bn]||Object.values(ix)[0];
  const r=main?.r?.[st.period];
  const N=Math.min(130,b.bench.length),ser=b.bench.slice(-N),vals=ser.filter(isNum);
  let spark="";
  if(vals.length>2){const lo=Math.min(...vals),hi=Math.max(...vals),W=400,H=76,x=i=>i*(W/(N-1)),y=v=>H-4-(v-lo)/(hi-lo||1)*(H-10);
    let d="";ser.forEach((v,i)=>{if(isNum(v))d+=(d?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
    spark=`<svg class="spark" viewBox="0 0 400 76" preserveAspectRatio="none" role="img" aria-label="${esc(bn)} over the last ${N} sessions"><path class="a" d="${d}L${W},${H}L0,${H}Z"/><path class="l" d="${d}"/></svg>`}
  const others=Object.entries(ix).filter(([k])=>k!==bn);
  const a50=b.a50[L],a200=b.a200[L],adv=b.adv[L],dec=b.dec[L],nh=b.nh[L],nl=b.nl[L],u4=b.up4[L],d4=b.dn4[L];
  const vd=a50>=60?["Strong","up"]:a50>=40?["Mixed",""]:["Weak","down"];
  const d50=a50-b.a50[Math.max(0,L-5)],tt=(D.scans?.hits?.trend_template||[]).length;
  const split=(a,c)=>{const t=a+c||1;return `<div class="meter split" aria-hidden="true"><i style="width:${a/t*100}%"></i><i style="width:${c/t*100}%"></i></div>`};
  $("#pulse").innerHTML=`
  <div class="hero-idx">
    <div class="lab"><span>${esc(bn)}</span><span>${st.period==="1D"?"Today":PL[st.period]+" change"}</span></div>
    <div><span class="val num">${main?inr(main.px):"–"}</span><span class="chg num ${cls(r)}">${sgn(r)}</span></div>
    ${spark}
    <div class="minis">${others.map(([k,v])=>`<div class="mini"><span>${esc(k.replace("NIFTY ","Nifty ").replace("SMLCAP","Smallcap").replace("MIDCAP","Midcap").replace("MICROCAP","Microcap "))}</span><b class="num ${cls(v.r[st.period])}">${sgn(v.r[st.period])}</b></div>`).join("")}</div>
  </div>
  <div class="health">
    <div class="verdict"><span class="k">Breadth reading</span><span class="v ${vd[1]}" style="${vd[1]?"":"color:var(--accent)"}">${vd[0]}</span>
      <span class="why">${a50.toFixed(1)}% of ${m.universe.toLocaleString("en-IN")} stocks above their 50 DMA · <span class="${cls(d50)}">${d50>0?"+":""}${d50.toFixed(1)} pts</span> in a week</span></div>
    <div class="hm"><div class="k"><span>Above 50 DMA</span><b class="num">${a50.toFixed(1)}%</b></div><div class="meter"><i style="width:${a50}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Above 200 DMA</span><b class="num">${a200.toFixed(1)}%</b></div><div class="meter"><i style="width:${a200}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Advances / declines</span><b class="num"><span class="up">${adv}</span> / <span class="down">${dec}</span></b></div>${split(adv,dec)}</div>
    <div class="hm"><div class="k"><span>52-week highs / lows</span><b class="num"><span class="up">${nh}</span> / <span class="down">${nl}</span></b></div>${split(nh,nl)}</div>
    <div class="hm"><div class="k"><span>Up 4%+ / down 4%+</span><b class="num"><span class="up">${u4}</span> / <span class="down">${d4}</span></b></div>${split(u4,d4)}</div>
    <div class="hm"><div class="k"><span>Pass Minervini trend template</span><b class="num">${tt} <span style="color:var(--band-muted);font-weight:500;font-size:15px">(${(tt/m.universe*100).toFixed(1)}%)</span></b></div><div class="meter"><i style="width:${Math.min(100,tt/m.universe*100)}%"></i></div></div>
  </div>`;
}
function renderFoot(){
  const m=D.meta,f=m.filters||{};
  $("#foot").innerHTML=`<p>Universe: ${m.universe.toLocaleString("en-IN")} NSE stocks (price ≥ ₹${f.min_price}, median daily turnover ≥ ₹${f.min_median_turnover_cr} Cr${f.min_market_cap_cr?`, market cap ≥ ₹${f.min_market_cap_cr} Cr`:""}). Prices from ${m.source==="upstox"?"Upstox (split- and bonus-adjusted), with today's candle checked against the NSE bhavcopy":m.source==="yahoo"?"Yahoo Finance (backup source)":esc(m.source)}. Refreshed every weekday evening.</p><p>For personal research. Not investment advice.</p>`;
}

/* ════════════════════ generic table ════════════════════ */
const TBL={};
function dtable(id,rows,cols,{limit=100,empty="Nothing to show.",csv=true}={}){
  const T=st.tbl[id]||(st.tbl[id]={key:null,dir:-1,show:limit});
  if(!rows.length)return `<div class="empty">${esc(empty)}</div>`;
  let data=rows;
  if(T.key){const c=cols.find(c=>c.k===T.key);if(c){const f=c.sort||(r=>r[c.k]);data=[...rows].sort((a,b)=>{const A=f(a),B=f(b);if(A==null||A==="")return 1;if(B==null||B==="")return -1;return typeof A==="string"?T.dir*A.localeCompare(B):T.dir*(A-B)})}}
  const vis=data.slice(0,T.show);
  let h=`<div class="tscroll"><table class="dt" data-tid="${esc(id)}"><thead><tr>${cols.map(c=>`<th class="${c.l?"l":""}" data-k="${esc(c.k)}" tabindex="0" aria-sort="${T.key===c.k?(T.dir<0?"descending":"ascending"):"none"}">${esc(c.label)}${T.key===c.k?(T.dir<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of vis)h+="<tr>"+cols.map(c=>`<td class="${c.l?"l ":""}${c.td?c.td(r):""}">${c.fmt?c.fmt(r):esc(r[c.k]??"–")}</td>`).join("")+"</tr>";
  h+=`</tbody></table></div><div class="tfoot"><span>${rows.length.toLocaleString("en-IN")} rows${rows.length>T.show?` · showing ${T.show}`:""}</span><span>`;
  if(rows.length>T.show)h+=`<button class="ghost" type="button" data-more="${esc(id)}">Show ${Math.min(100,rows.length-T.show)} more</button> `;
  if(csv)h+=`<button class="ghost" type="button" data-csv="${esc(id)}">Download CSV</button>`;
  h+=`</span></div>`;
  TBL[id]={rows:data,cols};
  return h;
}
function wireTables(root,rerender){
  root.querySelectorAll("table.dt").forEach(t=>{const id=t.dataset.tid;
    t.querySelectorAll("th[data-k]").forEach(th=>{const go=()=>{const T=st.tbl[id];const k=th.dataset.k;T.dir=T.key===k?-T.dir:-1;T.key=k;rerender()};th.addEventListener("click",go);th.addEventListener("keydown",e=>{if(e.key==="Enter")go()})})});
  root.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{st.tbl[b.dataset.more].show+=100;rerender()}));
  root.querySelectorAll("[data-csv]").forEach(b=>b.addEventListener("click",()=>downloadCsv(b.dataset.csv)));
}
function downloadCsv(id){

/* ════════════════════ ROTATION ════════════════════ */
function groupStats(prev,period=st.period,group=st.group){
  const g=D.groups[group]||{},key=prev?"rp":"r",out=[];
  for(const [name,syms] of Object.entries(g)){
    const live=syms.filter(s=>D.by[s]);
    const pairs=live.map(s=>[s,D.by[s][key]?.[period]]).filter(([,v])=>isNum(v));
    if(pairs.length<(D.meta.min_group_size||3))continue;
    const vals=pairs.map(p=>p[1]),a50=live.filter(s=>D.by[s].a50!=null);
    out.push({name,n:vals.length,v:st.agg==="mean"?mean(vals):median(vals),adv:vals.filter(v=>v>0).length/vals.length*100,
      br:a50.length?a50.filter(s=>D.by[s].a50).length/a50.length*100:null,syms:live,top:[...pairs].sort((a,b)=>b[1]-a[1]).slice(0,2)});
  }
  return out;
}
function renderRotation(){
  const now=groupStats(false),prev=groupStats(true);
  const prank={};[...prev].sort((a,b)=>b.v-a.v).forEach((g,i)=>prank[g.name]=i+1);
  const ranked=[...now].sort((a,b)=>b.v-a.v);ranked.forEach((g,i)=>g.rank=i+1);
  let rows=ranked;if(st.sort==="name")rows=[...now].sort((a,b)=>a.name.localeCompare(b.name));if(st.sort==="br")rows=[...now].sort((a,b)=>(b.br??-1)-(a.br??-1));
  const what=st.group==="Themes"?"theme":st.group==="NSE Index"?"NSE index":st.group.toLowerCase();
  let h=`<div class="sec-head"><div><h2>Where the money is rotating</h2><p>Average return of the stocks in each ${what}, ranked. Arrows show rank change against a week ago. Tap a row for its stocks.</p></div></div>
  <div class="card toolbar">
    <div class="ctl"><span>Period</span>${seg("period",PERIODS,st.period,PL)}</div>
    <div class="ctl"><span>Group by</span>${seg("group",Object.keys(D.groups),st.group)}</div>
    <div class="ctl"><span>Average</span>${seg("agg",["mean","median"],st.agg,{mean:"Mean",median:"Median"})}</div>
    <div class="ctl"><span>Sort</span>${seg("sort",["ret","br","name"],st.sort,{ret:"Return",br:"Breadth",name:"A–Z"})}</div>
    <div class="ctl"><span>View</span>${seg("view",["bars","heat"],st.view,{bars:"Bars",heat:"Heatmap"})}</div>
  </div>`;
  if(!rows.length){$("#view").innerHTML=h+`<div class="card empty">No group has ${D.meta.min_group_size}+ stocks with data for this period.</div>`;return}
  if(st.view==="heat"){$("#view").innerHTML=h+heatmap(rows);wireTables($("#view"),renderRotation);return}
  const mx=Math.max(1,...now.map(g=>Math.abs(g.v))),showRank=st.period!=="1D";
  h+=`<div class="card rows">`;
  for(const g of rows){
    const w=Math.abs(g.v)/mx*50,left=g.v>=0?50:50-w,pr=prank[g.name],dr=pr?pr-g.rank:0;
    const rk=!showRank||!pr?"<span></span>":dr>0?`<span class="rk gain" title="Rank a week ago: ${pr}">▲${dr}</span>`:dr<0?`<span class="rk loss" title="Rank a week ago: ${pr}">▼${-dr}</span>`:`<span class="rk" title="Rank unchanged">=</span>`;
    const open=st.open===g.name;
    h+=`<div class="brow" tabindex="0" role="button" aria-expanded="${open}" data-g="${esc(g.name)}">
      <div class="bname">${esc(g.name)}<span class="cnt">${g.n}</span><span class="lead">Top: ${g.top.map(([s,v])=>`${esc(s)} ${sgn(v,1)}`).join(" · ")}</span></div>
      <div class="btrack" aria-hidden="true"><div class="zero"></div><div class="fill ${g.v>=0?"pos":"neg"}" style="left:${left}%;width:${w}%"></div></div>
      <div class="bval num ${cls(g.v)}">${sgn(g.v)}</div>${rk}
      ${open?members(g):""}</div>`;
  }
  h+=`</div><p class="note">Bars are the ${st.agg} ${st.period==="1D"?"today's":PL[st.period]} return of stocks in each group (groups need ${D.meta.min_group_size}+ stocks).</p>`;
  $("#view").innerHTML=h;wireTables($("#view"),renderRotation);
}
function members(g){
  return `<div class="members"><div class="meta">${g.adv.toFixed(0)}% of stocks up over ${st.period==="1D"?"today":PL[st.period]} · ${g.br==null?"–":g.br.toFixed(0)+"%"} above 50 DMA</div>${dtable("grp_"+g.name,g.syms.map(s=>D.by[s]),[C.stock,C.ret(st.period),C.px,C.mc,C.rs,C.fr,C.pe,C.h52,C.st,C.vr],{limit:60,csv:false})}</div>`;
}
function heatmap(rows){
  const stats=Object.fromEntries(PERIODS.map(p=>[p,Object.fromEntries(groupStats(false,p).map(g=>[g.name,g.v]))]));
  const mx=Object.fromEntries(PERIODS.map(p=>[p,Math.max(1,...Object.values(stats[p]).map(Math.abs))]));
  const sorted=st.sort==="ret"?[...rows].sort((a,b)=>(stats[st.period][b.name]??-999)-(stats[st.period][a.name]??-999)):rows;
  const cell=(v,m)=>{if(!isNum(v))return `<div class="cell">–</div>`;const f=Math.min(1,Math.abs(v)/m),c=v>=0?"var(--up)":"var(--down)";return `<div class="cell num" style="background:color-mix(in srgb,${c} ${Math.round(8+f*62)}%,transparent);${f>.55?"color:#fff":""}">${sgn(v,1)}</div>`};
  let h=`<div class="card"><div class="tscroll"><table class="heat"><thead><tr><th>Group</th>${PERIODS.map(p=>`<th data-hp="${p}" class="${p===st.period?"on":""}" tabindex="0">${p}</th>`).join("")}</tr></thead><tbody>`;
  for(const g of sorted){h+=`<tr class="hr" data-g="${esc(g.name)}" tabindex="0"><td>${esc(g.name)} <span style="color:var(--muted);font-weight:400;font-size:14px">${g.n}</span></td>${PERIODS.map(p=>`<td>${cell(stats[p][g.name],mx[p])}</td>`).join("")}</tr>`;
    if(st.open===g.name)h+=`<tr><td colspan="${PERIODS.length+1}" style="padding:0 8px 10px;position:static">${members(g)}</td></tr>`}
  return h+`</tbody></table></div></div><p class="note">Colour depth is scaled within each period column. Click a period heading to rank by it; click a group for its stocks.</p>`;
}

/* ════════════════════ BREADTH ════════════════════ */
function lineChart(id,series,o){
  const W=1000,H=o.h||300,pl=46,pr=14,pt=12,pb=28,n=D.breadth.dates.length;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=(v,lo,hi)=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g="";
  for(const t of o.ticks)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t,o.lo,o.hi)}" y2="${y(t,o.lo,o.hi)}" stroke="var(--track)" stroke-width="${t===o.mid?1.6:1}"/><text x="${pl-8}" y="${y(t,o.lo,o.hi)+4}" text-anchor="end">${t}${o.unit||""}</text>`;
  const step=Math.ceil(n/6);for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${new Date(D.breadth.dates[i]+"T00:00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</text>`;
  for(const s of series){const lo=s.lo??o.lo,hi=s.hi??o.hi;
    if(s.bars){const bw=Math.max(1,(W-pl-pr)/n-1),y0=y(0,lo,hi);s.data.forEach((v,i)=>{if(v==null)return;const yy=y(v,lo,hi);g+=`<rect x="${x(i)-bw/2}" y="${Math.min(yy,y0)}" width="${bw}" height="${Math.max(1,Math.abs(yy-y0))}" fill="${v>=0?"var(--up)":"var(--down)"}"/>`});continue}
    const pts=s.data.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v,lo,hi).toFixed(1)}`).filter(Boolean).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`}
  g+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  return `<svg data-chart="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label)}" style="touch-action:pan-y;display:block">${g}<rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
}
function wireChart(box,id,fmtTip){
  const svg=box.querySelector(`svg[data-chart="${id}"]`),tip=box.querySelector(".tip"),xh=svg.querySelector(".xh"),n=D.breadth.dates.length,W=1000,pl=46,pr=14;
  const move=e=>{const r=svg.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=Math.max(0,Math.min(n-1,Math.round((cx/r.width*W-pl)/((W-pl-pr)/(n-1))))),sx=pl+i*(W-pl-pr)/(n-1);
    xh.setAttribute("x1",sx);xh.setAttribute("x2",sx);xh.setAttribute("opacity",".7");tip.hidden=false;tip.innerHTML=fmtTip(i);
    const bx=box.getBoundingClientRect(),tw=tip.offsetWidth;let left=sx/W*r.width+(r.left-bx.left)+12;if(left+tw>bx.width-8)left-=tw+24;tip.style.left=Math.max(4,left)+"px";tip.style.top="48px"};

}
function renderBreadth(){

function fmtMetric(m,v){if(!isNum(v))return "–";return m.fmt==="pct"?(v>=999?"≥999%":sgn(v,1)):m.fmt==="x"?v.toFixed(1)+"×":m.fmt==="int"?v.toFixed(0):v.toFixed(Math.abs(v)<100?1:0)}
function renderScanners(){
  const S=D.scans;if(!S?.meta){$("#view").innerHTML=`<div class="err">Scanner data is in an older format. Run “Daily update” once.</div>`;return}

      const se=objs(S.sector_either),ie=objs(S.industry_either),sk=objs(S.stock_table);
      h+=`<div class="tiles"><div class="card tile"><div class="k">Stocks passing G5 ∧ G6 ∧ G7</div><div class="v num">${tot}</div></div><div class="card tile"><div class="k">Sectors with at least one leader</div><div class="v num">${both.filter(r=>r.stocks_passing>0).length}</div></div><div class="card tile"><div class="k">Top sector</div><div class="v" style="font-size:24px">${esc(both[0].sector)}</div><div class="d" style="color:var(--muted)">${both[0].stocks_passing} stocks · ${both[0]["hit_rate_%"]}% of the sector</div></div></div>
      <div class="cols2"><div class="card pad"><h3 style="font-size:19px;margin-bottom:8px">🥇 Sectors — all three gates</h3>${bars(both,"sector")}<p class="note">Bar = stocks passing; % = share of the sector.</p></div>
        <div class="card pad"><h3 style="font-size:19px;margin-bottom:8px">🏷️ Industries — all three gates</h3>${bars(ind,"industry")}</div></div>
      <details class="exp"><summary>📊 Broader breadth — any of G5, G6, G7 firing</summary><div class="cols2" style="padding:0 12px 8px"><div>${dtable("vp_se_"+f,se.slice(0,20),vcols(se,Object.keys(se[0]||{})),{csv:false})}</div><div>${dtable("vp_ie_"+f,ie.slice(0,20),vcols(ie,Object.keys(ie[0]||{})),{csv:false})}</div></div></details>
      <details class="exp"><summary>🔬 Stock-level view — every passer with sector tags</summary><div>${dtable("vp_stk_"+f,sk,vcols(sk,Object.keys(sk[0]||{})))}</div></details>`}
  }else if(t==="rotn"){
    const R=await vpRot(),rows=objs(R.table);
    h+=`<p class="note" style="margin:0 0 12px">Stocks passing G5 ∧ G6 ∧ G7 per sector, one snapshot per week. A sector climbing 2 → 5 → 9 leaders is rotating in; a fading one is rotating out.</p>`;
    if(!rows.length)h+=`<div class="card empty">No history yet. Each week adds a column.</div>`;
    else{const weeks=R.table.columns.slice(1),mx=Math.max(1,...rows.flatMap(r=>weeks.map(w=>r[w]||0)));

      <p class="note">${R.weeks} weekly snapshot(s) so far.</p>`;
      if(R.rot_in||R.rot_out)h+=`<div class="cols2"><div class="card pad"><h3 style="font-size:19px">🚀 Rotating in</h3>${(R.rot_in||[]).map(([s,v])=>`<div class="hbar"><span>${esc(s)}</span><span></span><b class="up num" style="text-align:right">+${v}</b></div>`).join("")||"–"}</div><div class="card pad"><h3 style="font-size:19px">🪂 Rotating out</h3>${(R.rot_out||[]).map(([s,v])=>`<div class="hbar"><span>${esc(s)}</span><span></span><b class="down num" style="text-align:right">${v}</b></div>`).join("")||"–"}</div></div>`}
  }
  box.innerHTML=h;wireTables(box,vpTab);wireVtools();
}

/* ════════════════════ fundamentals (stock card) ════════════════════ */
let FUND=null;
async function fundLoad(){if(window.EMBED?.fund)return window.EMBED.fund;if(!D.meta.fund)return null;if(!FUND){const r=await fetch(`data/fund.json?v=${Date.now()}`);FUND=r.ok?await r.json():{}}return FUND}
const fmtCr=v=>!isNum(v)?"–":Math.abs(v)>=100?Math.round(v).toLocaleString("en-IN"):v.toFixed(1);
const qLabel=d=>{if(!d)return"";const t=new Date(d+"T00:00:00");return t.toLocaleDateString("en-IN",{month:"short",year:"2-digit"})};
function fundSection(x,fd){
  const kv=(k,v)=>`<div><dt>${k}</dt><dd class="num">${v}</dd></div>`,n=(v,d=1,suf="")=>isNum(v)?v.toFixed(d)+suf:"–",g=v=>`<span class="${cls(v)}">${gcap(v)}</span>`;
  let h=`<div class="dsec"><h4>Fundamentals${x.qe?` · quarter to ${esc(qLabel(x.qe))}, filed ${esc(fmtDate(x.filed))}`:""}</h4><dl class="dgrid">
    ${kv("Fund rating",rsPill(x.fr))}${kv("P/E",n(x.pe))}${kv("P/S",n(x.ps))}${kv("PEG",n(x.peg,2))}
    ${kv("Profit YoY",g(x.pat_yoy))}${kv("Revenue YoY",g(x.rev_yoy))}${kv("Profit, last 4 qtrs",g(x.pat_ttm_g))}${kv("Revenue, last 4 qtrs",g(x.rev_ttm_g))}
    ${kv(`ROE${x.roe_fy?" FY"+x.roe_fy:""}`,n(x.roe,1,"%"))}${x.bank?"":kv(`ROCE${x.roe_fy?" FY"+x.roe_fy:""}`,n(x.roce,1,"%"))}${x.bank?"":kv("Debt / equity",n(x.de,2))}${x.bank?kv("Net margin",n(x.npm,1,"%")):kv("Operating margin",n(x.opm,1,"%")+(isNum(x.opm_chg)?` <span class="${cls(x.opm_chg)}" style="font-size:13px">(${x.opm_chg>0?"+":""}${x.opm_chg.toFixed(1)})</span>`:""))}
    ${x.bank?"":kv(`Free cash flow${x.fy?" FY"+x.fy.slice(2):""}`,isNum(x.fcf)?"₹"+fmtCr(x.fcf)+" Cr":"–")}${kv("Next results",x.next_results?esc(fmtDate(x.next_results)):"–")}
  </dl>`;
  const q=fd?.q||[];
  if(q.length){
    const rows=q.map((r,i)=>{const ya=q[i-4];const yoy=ya&&isNum(ya[2])&&ya[2]>0&&isNum(r[2])?(r[2]/ya[2]-1)*100:null;
      return `<tr><td>${esc(r[0])}</td><td>${fmtCr(r[1])}</td><td>${fmtCr(r[2])}</td><td>${isNum(r[3])?r[3].toFixed(2):"–"}</td><td>${isNum(r[4])?r[4].toFixed(1):isNum(r[5])?r[5].toFixed(1):"–"}</td><td class="${cls(yoy)}">${yoy==null?"–":sgn(Math.max(-100,Math.min(999,yoy)),0)}</td></tr>`}).reverse().join("");
    h+=`<p class="dsub">Quarterly results · ₹ Cr · ${esc(fd.basis||"")}</p><div class="fscroll"><table class="ftbl"><thead><tr><th>Quarter</th><th>Revenue</th><th>Profit</th><th>EPS</th><th>${x.bank?"Net":"Op."} margin %</th><th>Profit YoY</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const hs=fd?.h||[];
  if(hs.length){
    h+=`<p class="dsub">Shareholding % · change over the year: promoter ${sgn(x.promoter_1y,2)}, FII ${sgn(x.fii_1y,2)}, DII ${sgn(x.dii_1y,2)}, MF ${sgn(x.mf_1y,2)}</p><div class="fscroll"><table class="ftbl"><thead><tr><th>Quarter</th><th>Promoter</th><th>FII</th><th>DII</th><th>MF</th><th>Individuals</th><th>Holders</th></tr></thead><tbody>${[...hs].reverse().map(r=>`<tr><td>${esc(r[0])}</td>${[1,2,3,4,5].map(i=>`<td>${isNum(r[i])?r[i].toFixed(2):"–"}</td>`).join("")}<td>${isNum(r[6])?r[6].toLocaleString("en-IN"):"–"}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(x.flags?.length)h+=`<p class="dsub">Red flags</p><ul class="flags">${x.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  return h+`<p class="note" style="margin:10px 0 0">Source: company filings on NSE. P/E uses today's market cap. Fund rating 1–99 ranks every stock on profit growth (latest two quarters and last four), revenue growth, ROE and margin trend — 70% growth, 30% quality.</p></div>`;
}

/* ════════════════════ global search ════════════════════ */
const QS={list:null,sel:0,items:[]};
async function searchList(){
  if(QS.list)return QS.list;if(!D.stocks)return [];
  const L=D.stocks.map(x=>({s:x.s,n:x.n||"",x})),have=new Set(L.map(o=>o.s));
  try{const d=await vpLoad("completed");for(const r of objs(d.results))if(r.symbol&&!have.has(r.symbol)){have.add(r.symbol);L.push({s:r.symbol,n:r["Company Name"]||"",ex:r.exchange})}}catch(e){}
  return QS.list=L;
}
function qScore(o,q){const s=o.s,n=o.n.toUpperCase();if(s===q)return 0;if(s.startsWith(q))return 1;if(n.startsWith(q))return 2;if(s.includes(q))return 3;if(n.split(/[\s.&()-]+/).some(w=>w.startsWith(q)))return 4;return n.includes(q)?5:9}
function hl(t,q){const i=t.toUpperCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function closeSearch(){$("#gqres").hidden=true;$("#gq").setAttribute("aria-expanded","false")}
async function runSearch(){
  const inp=$("#gq"),box=$("#gqres"),raw=inp.value.trim(),q=raw.toUpperCase();
  if(!q){closeSearch();return}
  const L=await searchList();if(inp.value.trim().toUpperCase()!==q)return;
  const res=L.map(o=>[qScore(o,q),o]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||(b[1].x?.mc||0)-(a[1].x?.mc||0)).slice(0,10).map(a=>a[1]);
  QS.items=res;QS.sel=0;
  box.innerHTML=res.length?res.map((o,i)=>{const x=o.x,right=x?`<span class="num ${cls(x.r["1D"])}">${sgn(x.r["1D"])}</span><small>₹${inr(x.px)}${isNum(x.mc)?` · ₹${Math.round(x.mc).toLocaleString("en-IN")} Cr`:""}</small>`:`<small>VPCI list only</small>`;
      return `<button type="button" class="opt" role="option" id="gqo${i}" aria-selected="${i===0}" data-i="${i}"><b>${hl(o.s,q)}</b><span class="rt">${right}</span><span class="nm">${hl(o.n,q)}</span></button>`}).join("")+`<div class="hint">↑ ↓ to move · Enter to open · Esc to close</div>`
    :`<div class="none">No stock matches “${esc(raw)}”. Searchable: NSE stocks that pass the liquidity filter (price ≥ ₹20, median turnover ≥ ₹1 Cr) plus every stock in the VPCI list.</div>`;
  box.hidden=false;inp.setAttribute("aria-expanded","true");
}
function pickSearch(i){const o=QS.items[i];if(!o)return;const inp=$("#gq");closeSearch();inp.value="";inp.blur();openDrawer(o.s,o.ex)}
$("#gq").addEventListener("input",runSearch);
$("#gq").addEventListener("focus",()=>{searchList();if($("#gq").value.trim())runSearch()});
$("#gq").addEventListener("blur",()=>setTimeout(closeSearch,150));
$("#gq").addEventListener("keydown",e=>{const box=$("#gqres");
  if(e.key==="Escape"){e.stopPropagation();closeSearch();e.target.blur();return}
  if(box.hidden||!QS.items.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();QS.sel=(QS.sel+(e.key==="ArrowDown"?1:-1)+QS.items.length)%QS.items.length;
    box.querySelectorAll(".opt").forEach((b,i)=>b.setAttribute("aria-selected",i===QS.sel));$("#gqo"+QS.sel)?.scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"){e.preventDefault();pickSearch(QS.sel)}});
$("#gqres").addEventListener("mousedown",e=>{const b=e.target.closest(".opt");if(b){e.preventDefault();pickSearch(+b.dataset.i)}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")&&$("#drawer").hidden){e.preventDefault();$("#gq").focus()}});

$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.v)});
document.addEventListener("click",e=>{
  const sb=e.target.closest(".symbtn");if(sb){openDrawer(sb.dataset.sym,sb.dataset.ex);return}

    if(k==="scanFund"){st.scanFund=+v;store.set("scanFund",st.scanFund);renderScanners();return}
    if(k==="fundmin"){st.rs.fmin=+v;store.set("rs",st.rs);s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawRS();return}
    if(k==="rsmin"){st.rs.min=+v;store.set("rs",st.rs);s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawRS();return}
    st[k]=v;if(k==="group")st.open=null;store.set("prefs",{period:st.period,group:st.group,agg:st.agg,sort:st.sort,view:st.view});
    if(k==="period")renderPulse();renderRotation();return}
  const vt=e.target.closest("[data-vtab]");if(vt){VP.tab=vt.dataset.vtab;document.querySelectorAll("[data-vtab]").forEach(b=>b.setAttribute("aria-pressed",b===vt));vpTab();return}

  if(e.target.closest(".members")||e.target.closest("details")||e.target.closest("#drawer"))return;
  const r=e.target.closest(".brow,.heat tr.hr");if(r){st.open=st.open===r.dataset.g?null:r.dataset.g;renderRotation();return}
});

});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(TABS.includes(t)&&t!==st.tab)go(t)});
$("#themeBtn").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme)});
(()=>{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;Object.assign(st,store.get("prefs",{}));Object.assign(st.rs,store.get("rs",{}));st.scan=store.get("scan2",st.scan);st.scanTop=+store.get("scanTop",0)||0;st.scanFund=+store.get("scanFund",0)||0;
  const h=location.hash.slice(1);st.tab=TABS.includes(h)?h:store.get("tab","rotation")})();

load().then(()=>{index();renderHeader();renderFoot();render()}).catch(err=>{
  $("#asof").textContent="";
  $("#view").innerHTML=`<div class="err"><b>Data files could not be loaded.</b><br>${esc(err.message)}. The evening job may not have run yet — open the Actions tab on GitHub, run “Daily update” once, then reload.</div>`;
});
</script>
